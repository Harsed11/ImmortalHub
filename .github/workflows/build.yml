name: Build ImmortalHub Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Static Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run Test Suite
        run: |
          pip install pytest
          pytest tests -v

      - name: Build Standalone Executable
        run: |
          python build_exe.py

      - name: Archive Portable Bundle
        run: |
          Compress-Archive -Path dist/ImmortalHub/* -DestinationPath dist/ImmortalHub_Portable_x64.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalHub-Windows-x64
          path: dist/ImmortalHub_Portable_x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImmortalHub_Portable_x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
